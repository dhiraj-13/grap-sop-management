<div class="ov show" id="ov" (click)="close.emit()">
  <div class="drawer" id="drawer" (click)="$event.stopPropagation()">
    <div class="bar">
      <h2>Activity – {{ sop.id }}</h2>
      <button class="btn sm" style="margin-left: auto" (click)="close.emit()">
        ✕
      </button>
    </div>
    <div class="muted">{{ sop.n }}</div>

    <div class="tl">
      <div class="e" *ngFor="let e of reversedHistory">
        <b>{{ e[1] }}</b> · {{ e[4] }}<br />
        <small>{{ e[0] }} · {{ e[5] }}</small>
        <div class="hint">{{ e[2] }} → {{ e[3] }}</div>
        <div class="rm" *ngIf="e[6]">💬 {{ e[6] }}</div>
      </div>
    </div>
  </div>
</div>
